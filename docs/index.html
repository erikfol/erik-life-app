<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erik's Life App</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <meta name="theme-color" content="#1a1a2e">
    <script>
        // Links saved before Bills Etc moved to its own page (…/#month, …/#utilities/water) still open that page.
        if (location.hash.length > 1) location.replace('bills-etc/' + location.hash);
    </script>
    <!-- app-version:start (written by tools/stamp_version.py) -->
    <script type="module">
        const VERSION = "20261124162213";
        const FILES = ["401k/js/401k.js", "401k/js/alerts.js", "bills-etc/js/alerts.js", "bills-etc/js/bills.js", "bills-etc/js/data.js", "bills-etc/js/electric.js", "bills-etc/js/finance.js", "bills-etc/js/heating.js", "bills-etc/js/loans.js", "bills-etc/js/merchants.js", "bills-etc/js/propane.js", "bills-etc/js/rules.js", "bills-etc/js/savings.js", "bills-etc/js/sheet.js", "bills-etc/js/taxes.js", "bills-etc/js/views/utilcommon.js", "bills-etc/js/water.js", "dinner-planner/js/alerts.js", "dinner-planner/js/leftovers.js", "dinner-planner/js/store.js", "gifts/js/alerts.js", "gifts/js/gifts.js", "health/js/alerts.js", "health/js/records.js", "house/js/alerts.js", "house/js/house.js", "pets/js/alerts.js", "pets/js/pets.js", "shared/css/base.css", "shared/css/home.css", "shared/js/appointments.js", "shared/js/assistant/chat.js", "shared/js/assistant/credits.js", "shared/js/assistant/panel.js", "shared/js/assistant/scrub.js", "shared/js/assistant/sources.js", "shared/js/assistant/tools.js", "shared/js/backup.js", "shared/js/charts.js", "shared/js/csv.js", "shared/js/dates.js", "shared/js/dropbox.js", "shared/js/fileguard.js", "shared/js/fs.js", "shared/js/home.js", "shared/js/util.js", "taxes/js/alerts.js", "taxes/js/taxes.js", "vehicles/js/alerts.js", "vehicles/js/vehicles.js"];
        // After an update, fetch every file fresh once so new pages never run with old cached code.
        try {
            if (localStorage.getItem('home-version') !== VERSION) {
                await Promise.all(FILES.map(f => fetch(f, { cache: 'reload' }).catch(() => null)));
                localStorage.setItem('home-version', VERSION);
                document.querySelectorAll('link[rel=stylesheet]').forEach(l => { l.href = l.getAttribute('href') + '?v=' + VERSION; });
            }
        } catch { /* storage blocked: just start */ }
        await import("./shared/js/home.js");
    </script>
    <!-- app-version:end -->
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="shared/css/home.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">Erik's Life App</div>
    </header>
    <main>
        <h1>Where to?</h1>
        <p class="lead">Pick a section.</p>
        <p class="alerts-note" id="alerts-note" hidden></p>
        <div class="apps">
            <a class="app" href="bills-etc/">
                <h2><span>Bills Etc</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="401k/">
                <h2><span>401(k)</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="taxes/">
                <h2><span>Taxes</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="health/">
                <h2><span>Health</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="vehicles/">
                <h2><span>Vehicles</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="house/">
                <h2><span>House</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="pets/">
                <h2><span>Pets</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="insurance/">
                <h2><span>Insurance</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="dinner-planner/">
                <h2><span>Dinner Planner</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="kid-lunches/">
                <h2><span>Kid Lunches</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="gifts/">
                <h2><span>Gifts, Bday, Anniversary</span><span class="alerts"></span></h2>
            </a>
            <a class="app" href="career/">
                <h2><span>Working Career</span><span class="alerts"></span></h2>
            </a>
        </div>
        <div class="backup" id="backup" hidden></div>
        <p class="dropbox" id="dropbox" hidden></p>
    </main>
    <div class="assistant" id="assistant"></div>
</body>
</html>
