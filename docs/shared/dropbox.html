<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signing in to Dropbox</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #2d2d2d; background: #f5f7fa; margin: 0; }
        main { max-width: 560px; margin: 60px auto; padding: 0 16px; }
        .bad { background: #fdecea; border-left: 4px solid #c0392b; padding: 12px 14px; border-radius: 6px; margin: 14px 0; }
        a { color: #4a90d9; }
    </style>
</head>
<body>
    <!-- Dropbox sends the browser back here after "Sign in with Dropbox" (docs/shared/js/dropbox.js). -->
    <main id="msg"><p>Signing in to Dropbox…</p></main>
    <script type="module">
        import { finishSignIn } from './js/dropbox.js';
        try {
            location.replace(await finishSignIn());
        } catch (e) {
            const msg = document.getElementById('msg');
            msg.innerHTML = '<h2>Couldn’t sign in to Dropbox</h2><div class="bad"></div><p><a href="../">Back to Erik’s Life App</a></p>';
            msg.querySelector('.bad').textContent = e.message;
        }
    </script>
</body>
</html>
